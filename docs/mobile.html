<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Order Bahi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper: #F4EEDF;
    --paper-deep: #EADFC4;
    --ink: #221D16;
    --ink-soft: #5B5245;
    --maroon: #7C2331;
    --maroon-deep: #5C1521;
    --gold: #B4791E;
    --teal: #2E4F3E;
    --paper-line: rgba(51,82,110,0.16);
    --shadow: 0 4px 12px rgba(34,29,22,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    font-size:16px;
  }

  .app{
    max-width:100%;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding-bottom:60px;
  }

  header.top{
    background:linear-gradient(135deg, #FBF8EF 0%, var(--paper-deep) 100%);
    border-bottom:3px solid var(--maroon);
    padding:14px;
    padding-top:max(14px, env(safe-area-inset-top));
  }
  .brand-mobile{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
  }
  .seal{
    width:40px;
    height:40px;
    border-radius:50%;
    border:2px solid var(--maroon);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Zilla Slab',serif;
    font-weight:700;
    color:var(--maroon);
    font-size:9px;
    text-align:center;
    line-height:1.1;
    flex-shrink:0;
  }
  h1{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:20px;
    margin:0;
    color:var(--maroon-deep);
  }
  .header-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    font-size:11px;
    color:var(--ink-soft);
  }
  .db-status{
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    text-align:right;
  }

  .tab-toggle{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .tab-btn{
    flex:1;
    padding:8px;
    border:1px solid rgba(124,35,49,0.3);
    border-radius:4px;
    background:transparent;
    color:var(--maroon-deep);
    font-family:'Zilla Slab',serif;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.5px;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--maroon);
    color:#fff;
    border-color:var(--maroon-deep);
  }

  #partyPane,#productPane{
    flex:1;
    display:flex;
    flex-direction:column;
  }

  .search-wrap{
    position:relative;
    margin:12px;
    margin-bottom:8px;
  }
  .search-wrap input{
    width:100%;
    padding:10px 10px 10px 36px;
    border:1px solid rgba(34,29,22,0.25);
    border-radius:6px;
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  .search-wrap input:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  .search-wrap svg{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    opacity:0.45;
  }

  #partyList,#productResults{
    list-style:none;
    margin:0;
    padding:0 12px;
    flex:1;
    overflow-y:auto;
  }
  #partyList li,#productResults li{
    padding:12px;
    margin-bottom:6px;
    border-radius:6px;
    border:1px solid rgba(34,29,22,0.1);
    background:rgba(255,255,255,0.6);
    cursor:pointer;
    font-size:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  #partyList li:active,#productResults li:active{
    background:rgba(34,29,22,0.1);
  }
  #partyList li.active{
    background:var(--maroon);
    color:#fff;
    border-color:var(--maroon-deep);
  }
  .cnt{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    opacity:0.75;
  }

  .pr-name{
    font-weight:600;
    font-size:13px;
    margin-bottom:6px;
  }
  .pr-parties{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
  }
  .pr-party-chip{
    font-size:10px;
    font-family:'IBM Plex Mono',monospace;
    background:rgba(51,82,110,0.12);
    color:var(--ink);
    border:1px solid rgba(51,82,110,0.3);
    border-radius:4px;
    padding:4px 8px;
    cursor:pointer;
  }
  .pr-party-chip:active{
    background:var(--ink);
    color:#fff;
  }

  .order-sheet{
    flex:1;
    padding:12px;
    overflow-y:auto;
  }

  .sheet-head{
    margin-bottom:12px;
  }
  .sheet-head h2{
    font-family:'Zilla Slab',serif;
    font-size:18px;
    margin:0 0 4px;
    color:var(--ink);
  }
  .sheet-meta{
    font-size:11px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:10px;
  }
  .field label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .field input[type="text"],
  .field input[type="tel"]{
    padding:10px;
    border:1px solid rgba(34,29,22,0.25);
    border-radius:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    background:#fff;
  }
  .field input:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  .field .hint{
    font-size:10px;
    color:var(--ink-soft);
    opacity:0.8;
  }

  .add-row{
    display:flex;
    gap:6px;
  }
  .add-row input{
    flex:1;
    padding:10px;
    border:1px solid rgba(34,29,22,0.25);
    border-radius:6px;
    font-size:14px;
  }
  .add-btn{
    background:var(--gold);
    color:#fff;
    border:none;
    border-radius:6px;
    font-weight:700;
    font-size:12px;
    padding:10px 12px;
    cursor:pointer;
    flex-shrink:0;
  }

  .table-wrap{
    margin-bottom:12px;
  }
  .order-table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  .order-table thead th{
    text-align:left;
    font-family:'Zilla Slab',serif;
    font-size:12px;
    color:#fff;
    background:var(--ink);
    padding:8px 6px;
  }
  .order-table thead th.sr-col{
    width:28px;
    text-align:center;
  }
  .order-table thead th.qty-col,
  .order-table thead th.unit-col,
  .order-table thead th.last-col{
    text-align:center;
    width:60px;
  }
  .order-table tbody tr{
    border-bottom:1px solid var(--paper-line);
  }
  .order-table tbody tr:nth-child(odd){
    background:rgba(51,82,110,0.04);
  }
  .order-table tbody tr.has-qty{
    background:rgba(180,121,30,0.15);
  }
  .order-table td{
    padding:8px 6px;
    vertical-align:middle;
    font-size:12px;
  }
  .order-table td.sr-col{
    text-align:center;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }
  .order-table td.qty-col,
  .order-table td.unit-col,
  .order-table td.last-col{
    text-align:center;
  }

  .qty-input,
  .unit-select{
    width:100%;
    padding:6px 4px;
    border:1px solid rgba(34,29,22,0.25);
    border-radius:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-align:center;
  }
  .qty-input{
    font-weight:600;
    color:var(--maroon-deep);
  }
  .qty-input:focus,
  .unit-select:focus{
    outline:2px solid var(--gold);
    outline-offset:0;
  }

  .last-val{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--teal);
    cursor:pointer;
  }
  .last-val.empty{
    color:var(--ink-soft);
    opacity:0.5;
  }

  .new-badge{
    font-size:8px;
    font-weight:700;
    background:var(--gold);
    color:#fff;
    border-radius:2px;
    padding:2px 4px;
    margin-left:4px;
  }
  .remove-prod{
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:14px;
    padding:0;
    margin-left:4px;
  }

  .footer-bar{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    padding:12px;
    border-top:1px dashed var(--paper-line);
    margin-top:10px;
  }
  .selected-count{
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }
  .selected-count strong{
    color:var(--maroon-deep);
    font-family:'IBM Plex Mono',monospace;
  }

  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .actions.three-col{
    grid-template-columns:1fr 1fr 1fr;
  }

  .btn-ghost{
    background:transparent;
    border:1px solid rgba(34,29,22,0.3);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:10px 8px;
    border-radius:6px;
    cursor:pointer;
  }
  .btn-ghost:active{
    background:rgba(34,29,22,0.06);
  }

  .copy-btn{
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:6px;
    font-weight:600;
    font-size:12px;
    padding:10px 8px;
    cursor:pointer;
  }
  .copy-btn:active{
    opacity:0.8;
  }
  .copy-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }

  .stamp-btn{
    position:relative;
    font-family:'Zilla Slab',serif;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    font-size:12px;
    color:var(--maroon);
    background:transparent;
    cursor:pointer;
    border:2px solid var(--maroon);
    border-radius:20px;
    padding:10px 14px;
    transition:all 0.1s ease;
  }
  .stamp-btn::before{
    content:"";
    position:absolute;
    inset:4px;
    border:1px solid var(--maroon);
    border-radius:inherit;
    opacity:0.3;
  }
  .stamp-btn:active{
    transform:scale(0.95);
    background:rgba(124,35,49,0.1);
  }
  .stamp-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }

  .review-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:100;
    display:flex;
    align-items:flex-end;
    padding:0;
  }
  .review-panel{
    background:#fff;
    width:100%;
    max-height:85vh;
    display:flex;
    flex-direction:column;
    border-radius:16px 16px 0 0;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .review-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--paper-line);
    padding:14px;
  }
  .review-head h2{
    font-family:'Zilla Slab',serif;
    font-size:16px;
    margin:0;
    color:var(--ink);
  }
  .close-btn{
    background:none;
    border:none;
    font-size:24px;
    color:var(--ink-soft);
    cursor:pointer;
    padding:0;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .review-content{
    flex:1;
    overflow-y:auto;
    padding:12px;
  }
  .review-item{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    padding:10px;
    margin-bottom:8px;
    border:1px solid var(--paper-line);
    border-radius:6px;
    background:#fafaf8;
  }
  .ri-prod .name{
    font-weight:600;
    font-size:13px;
  }
  .ri-qty{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .ri-qty input,
  .ri-qty select{
    padding:6px;
    border:1px solid rgba(34,29,22,0.25);
    border-radius:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .ri-qty input{
    width:50px;
    text-align:center;
  }
  .ri-qty select{
    width:50px;
  }
  .remove-row{
    background:none;
    border:none;
    color:var(--maroon);
    cursor:pointer;
    font-size:18px;
    padding:0;
    line-height:1;
  }

  .review-actions{
    display:flex;
    gap:10px;
    border-top:1px solid var(--paper-line);
    padding:12px;
    background:#f9f7f2;
  }
  .review-status{
    flex:1;
    font-size:10px;
    color:var(--teal);
    font-family:'IBM Plex Mono',monospace;
    align-self:center;
  }

  .placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
    gap:8px;
  }
  .placeholder .big{
    font-family:'Zilla Slab',serif;
    font-size:18px;
    color:var(--ink);
  }

  .toast{
    position:fixed;
    bottom:70px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#F4EEDF;
    padding:12px 18px;
    border-radius:8px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:50;
    max-width:90%;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .empty-note{
    font-size:12px;
    color:var(--ink-soft);
    padding:12px;
    text-align:center;
  }

  .fab{
    position:fixed;
    bottom:80px;
    right:16px;
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--maroon);
    border:none;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(124,35,49,0.3);
    z-index:40;
    opacity:0;
    pointer-events:none;
    transform:scale(0.7) translateY(20px);
    transition:all 0.3s ease;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .fab.visible{
    opacity:1;
    pointer-events:auto;
    transform:scale(1) translateY(0);
  }
  .fab:active{
    transform:scale(0.9);
  }

  @keyframes rowFlash{
    0%{background:rgba(180,121,30,0.5);}
    100%{background:transparent;}
  }
  tr.row-flash{
    animation:rowFlash 1.6s ease-out;
  }

  ::selection{background:rgba(180,121,30,0.35);}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand-mobile">
      <div class="seal">ORDER<br>BAHI</div>
      <div>
        <h1>Order Bahi</h1>
      </div>
    </div>
    <div class="header-info">
      <span id="todayDate"></span>
    </div>
    <div class="db-status" id="dbStatus"></div>
    <div class="tab-toggle">
      <button class="tab-btn active" id="tabParties" type="button">Parties</button>
      <button class="tab-btn" id="tabProducts" type="button">Products</button>
    </div>
  </header>

  <div id="partyPane" style="display:flex;">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#221D16" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
      <input type="text" id="partySearch" placeholder="Search party..." autocomplete="off">
    </div>
    <ul id="partyList"></ul>
  </div>

  <div id="productPane" style="display:none;flex-direction:column;">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#221D16" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
      <input type="text" id="productSearch" placeholder="Search product..." autocomplete="off">
    </div>
    <div class="empty-note" id="productHint">Type to search products</div>
    <ul id="productResults"></ul>
  </div>

  <main class="order-sheet" id="orderSheet">
    <div class="placeholder">
      <div class="big">No party selected</div>
      <p>Choose a party from the list</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<button class="fab" id="fabHome" title="Switch party">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
</button>

<div id="reviewModal" class="review-modal" style="display:none;">
  <div class="review-panel">
    <div class="review-head">
      <h2 id="reviewTitle">Review Order</h2>
      <button class="close-btn" id="closeReview">&times;</button>
    </div>
    <div id="reviewContent" class="review-content"></div>
    <div class="review-actions">
      <div class="review-status" id="reviewStatus"></div>
      <button class="btn-ghost" id="reviewCancelBtn">Back</button>
      <button class="stamp-btn" id="reviewSendBtn">Send</button>
    </div>
  </div>
</div>

const SK = 'partyOrderBahi_lastOrdered_v1';

function ls_get(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):{}}catch(e){return{}}}
function ls_set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

// Merge custom products
const customProducts = ls_get(CK);
const customKeySet = new Set();
Object.keys(customProducts).forEach(party=>{
  if(!PARTY_DATA[party]) return;
  customProducts[party].forEach(prod=>{
    if(!PARTY_DATA[party].includes(prod)) PARTY_DATA[party].push(prod);
    customKeySet.add(party+'||'+prod);
  });
  PARTY_DATA[party].sort((a,b)=>a.localeCompare(b));
});

// Merge uploaded data
const uploadedData = ls_get(UK);
Object.keys(uploadedData).forEach(party=>{
  if(!PARTY_DATA[party]) PARTY_DATA[party]=[];
  uploadedData[party].forEach(prod=>{
    if(!PARTY_DATA[party].includes(prod)) PARTY_DATA[party].push(prod);
  });
  PARTY_DATA[party].sort((a,b)=>a.localeCompare(b));
});

let partyNames = Object.keys(PARTY_DATA).sort((a,b)=>a.localeCompare(b));

// Draft state
const draft = ls_get(DK);
const quantities = draft.quantities || {};
const units = draft.units || {};
const waNumbers = draft.waNumbers || {};
const lastOrdered = ls_get(SK);

let draftTimer = null;
function saveDraft(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(()=>ls_set(DK,{quantities,units,waNumbers}),250);
}

// Product index
let PRODUCT_INDEX = {}, PRODUCT_KEYS = [];
function rebuildProductIndex(){
  PRODUCT_INDEX={};
  partyNames.forEach(p=>{
    PARTY_DATA[p].forEach(prod=>{
      const k=prod.toLowerCase();
      if(!PRODUCT_INDEX[k]) PRODUCT_INDEX[k]={display:prod,parties:[]};
      PRODUCT_INDEX[k].parties.push(p);
    });
  });
  PRODUCT_KEYS=Object.keys(PRODUCT_INDEX);
}
rebuildProductIndex();

let currentParty=null, activeTab='parties', pendingSendAction=null;

const todayStr = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
document.getElementById('todayDate').textContent = todayStr;

function updateDbStatus(){
  const meta = ls_get(UM);
  const total = partyNames.reduce((s,p)=>s+PARTY_DATA[p].length,0);
  try{document.getElementById('partyTotal').textContent=partyNames.length;}catch(e){}
  try{document.getElementById('productTotal').textContent=total;}catch(e){}
  let line = partyNames.length+' parties &middot; '+total+' products';
  if(meta && meta.when){
    const d=new Date(meta.when);
    line += '<br>Synced '+d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }
  document.getElementById('dbStatus').innerHTML = line;
}

function eH(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function eA(s){return eH(s);}
function lKey(p,prod){return p+'||'+prod;}

// Party list
function renderPartyList(filter=''){
  const ul=document.getElementById('partyList');
  ul.innerHTML='';
  const f=filter.trim().toLowerCase();
  partyNames.filter(p=>p.toLowerCase().includes(f)).forEach(p=>{
    const li=document.createElement('li');
    if(p===currentParty) li.classList.add('active');
    li.innerHTML='<span>'+eH(p)+'</span><span class="cnt">'+PARTY_DATA[p].length+'</span>';
    li.addEventListener('click',()=>selectParty(p));
    ul.appendChild(li);
  });
}

function selectParty(p){
  currentParty=p;
  if(!quantities[p]) quantities[p]={};
  if(!units[p]) units[p]={};
  renderPartyList(document.getElementById('partySearch').value);
  renderOrderSheet();
  // Show FAB
  const fab=document.getElementById('fabHome');
  if(fab) fab.classList.add('visible');
  // Auto-scroll to Add Product field
  setTimeout(()=>{
    const inp=document.getElementById('newProduct');
    if(inp){ inp.scrollIntoView({behavior:'smooth',block:'center'}); }
  }, 200);
}

// Order sheet
function renderOrderSheet(){
  const area=document.getElementById('orderSheet');
  if(!currentParty){
    area.innerHTML='<div class="placeholder"><div class="big">No party selected</div><p>Choose a party from the list on the left.</p></div>';
    return;
  }
  const waNum=waNumbers[currentParty]||'';
  area.innerHTML=`
    <div class="order-sheet">
      <div class="sheet-head">
        <div><h2>${eH(currentParty)}</h2><div class="sheet-meta">${PARTY_DATA[currentParty].length} products on record</div></div>
      </div>
      <div class="controls-row">
        <div class="field">
          <label>WhatsApp Number</label>
          <input type="tel" id="waNumber" placeholder="919876543210" value="${eA(waNum)}">
          <span class="hint">Country code, no + or spaces</span>
        </div>
        <div class="field">
          <label>Filter Products</label>
          <input type="text" id="prodSearch" placeholder="Type to filter...">
        </div>
        <div class="field">
          <label>Add New Product</label>
          <div class="add-row">
            <input type="text" id="newProduct" placeholder="Product name...">
            <button class="add-btn" id="addProductBtn">+ Add</button>
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table class="order-table">
          <thead><tr>
            <th class="sr-col">#</th>
            <th>Product Name</th>
            <th class="last-col">Last Ordered</th>
            <th class="qty-col">Qty</th>
            <th class="unit-col">Unit</th>
          </tr></thead>
          <tbody id="tblBody"></tbody>
        </table>
      </div>
      <p style="font-size:10px;color:var(--ink-soft);margin-top:6px;">PDF downloads to your device &mdash; open WhatsApp and attach it using the &#128206; button. Tap a Last Ordered value to reuse it.</p>
      <div class="footer-bar">
        <div class="selected-count" id="selCount">No quantities entered</div>
        <div class="actions three-col">
          <button class="btn-ghost" id="clearBtn">Clear</button>
          <button class="copy-btn" id="pdfBtn" disabled>Download PDF</button>
          <button class="stamp-btn" id="sendBtn" disabled>Send Order</button>
        </div>
      </div>
    </div>`;
  document.getElementById('waNumber').addEventListener('input',e=>{waNumbers[currentParty]=e.target.value.trim();updateSendState();saveDraft();});
  document.getElementById('prodSearch').addEventListener('input',e=>renderTableBody(e.target.value));
  document.getElementById('clearBtn').addEventListener('click',clearQty);
  document.getElementById('pdfBtn').addEventListener('click',()=>openModal('pdf'));
  document.getElementById('sendBtn').addEventListener('click',()=>openModal('whatsapp'));
  document.getElementById('addProductBtn').addEventListener('click',handleAdd);
  document.getElementById('newProduct').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handleAdd();}});
  renderTableBody('');
  updateSelectedCount();
}

function renderTableBody(filter){
  const tbody=document.getElementById('tblBody');
  if(!tbody) return;
  const f=filter.trim().toLowerCase();
  tbody.innerHTML='';
  let sr=0;
  PARTY_DATA[currentParty].forEach(prod=>{
    if(f&&!prod.toLowerCase().includes(f)) return;
    sr++;
    const val=quantities[currentParty][prod]||'';
    const unitVal=units[currentParty][prod]||'PCS';
    const tr=document.createElement('tr');
    if(val) tr.classList.add('has-qty');
    const lastRaw=lastOrdered[lKey(currentParty,prod)];
    const lastNorm=lastRaw&&typeof lastRaw==='object'?lastRaw:(lastRaw?{qty:lastRaw,unit:'PCS'}:null);
    const lastCell=lastNorm
      ?'<span class="last-val" data-prod="'+eA(prod)+'" data-qty="'+eA(lastNorm.qty)+'" data-unit="'+eA(lastNorm.unit)+'" title="Click to reuse">'+eH(lastNorm.qty)+' '+eH(lastNorm.unit)+'</span>'
      :'<span class="last-val empty">&mdash;</span>';
    const isCustom=customKeySet.has(currentParty+'||'+prod);
    const nameCell=eH(prod)+(isCustom?'<span class="new-badge">New</span><button class="remove-prod" data-prod="'+eA(prod)+'">&times;</button>':'');
    tr.innerHTML=`<td class="sr-col">${sr}</td><td>${nameCell}</td><td class="last-col">${lastCell}</td>
      <td class="qty-col"><input type="number" min="0" step="1" class="qty-input" data-prod="${eA(prod)}" value="${eA(val)}" placeholder="0"></td>
      <td class="unit-col"><select class="unit-select" data-prod="${eA(prod)}"><option value="PCS" ${unitVal==='PCS'?'selected':''}>PCS</option><option value="CB" ${unitVal==='CB'?'selected':''}>CB</option></select></td>`;
    tbody.appendChild(tr);
  });
  if(sr===0) tbody.innerHTML='<tr><td colspan="5" style="padding:20px;text-align:center;color:var(--ink-soft);">No products match.</td></tr>';
  tbody.querySelectorAll('.qty-input').forEach(inp=>{inp.addEventListener('input',e=>applyQty(e.target.getAttribute('data-prod'),e.target.value,e.target));});
  tbody.querySelectorAll('.unit-select').forEach(sel=>{sel.addEventListener('change',e=>applyUnit(e.target.getAttribute('data-prod'),e.target.value));});
  tbody.querySelectorAll('.last-val:not(.empty)').forEach(span=>{
    span.addEventListener('click',e=>{
      const prod=e.target.getAttribute('data-prod');
      const qty=e.target.getAttribute('data-qty');
      const unit=e.target.getAttribute('data-unit');
      const row=e.target.closest('tr');
      row.querySelector('.qty-input').value=qty;
      row.querySelector('.unit-select').value=unit;
      applyQty(prod,qty,row.querySelector('.qty-input'));
      applyUnit(prod,unit);
    });
  });
  tbody.querySelectorAll('.remove-prod').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const prod=e.target.getAttribute('data-prod');
      PARTY_DATA[currentParty]=PARTY_DATA[currentParty].filter(p=>p!==prod);
      if(customProducts[currentParty]) customProducts[currentParty]=customProducts[currentParty].filter(p=>p!==prod);
      ls_set(CK,customProducts);
      customKeySet.delete(currentParty+'||'+prod);
      delete quantities[currentParty][prod];
      rebuildProductIndex();
      renderTableBody(document.getElementById('prodSearch').value);
      renderPartyList(document.getElementById('partySearch').value);
      updateSelectedCount();
      saveDraft();
      showToast('Product removed');
    });
  });
}

function applyQty(prod,v,el){
  if(v===''||Number(v)<=0){delete quantities[currentParty][prod];el.closest('tr').classList.remove('has-qty');}
  else{quantities[currentParty][prod]=v;el.closest('tr').classList.add('has-qty');}
  updateSelectedCount();updateSendState();saveDraft();
}
function applyUnit(prod,unit){units[currentParty][prod]=unit;saveDraft();}

function currentEntries(){
  const qm=quantities[currentParty]||{};
  const um=units[currentParty]||{};
  return Object.entries(qm).filter(([p,q])=>q!==''&&Number(q)>0).map(([p,q])=>[p,q,um[p]||'PCS']);
}
function updateSelectedCount(){
  const e=currentEntries();
  const el=document.getElementById('selCount');
  if(!el) return;
  el.innerHTML=e.length===0?'No quantities entered &mdash; nothing to send':'<strong>'+e.length+'</strong> product'+(e.length>1?'s':'')+' queued';
  updateSendState();
}
function updateSendState(){
  const e=currentEntries();
  const num=(waNumbers[currentParty]||'').trim();
  const s=document.getElementById('sendBtn');
  const p=document.getElementById('pdfBtn');
  if(!s) return;
  s.disabled=e.length===0||num.length<6;
  p.disabled=e.length===0;
}
function clearQty(){
  quantities[currentParty]={};units[currentParty]={};
  renderTableBody(document.getElementById('prodSearch').value);
  updateSelectedCount();renderPartyList(document.getElementById('partySearch').value);saveDraft();
}
function handleAdd(){
  const inp=document.getElementById('newProduct');
  const prod=inp.value.trim();
  if(!prod){showToast('Enter a product name');return;}
  if(PARTY_DATA[currentParty].some(p=>p.toLowerCase()===prod.toLowerCase())){showToast("Already on this party's list");return;}
  PARTY_DATA[currentParty].push(prod);
  PARTY_DATA[currentParty].sort((a,b)=>a.localeCompare(b));
  if(!customProducts[currentParty]) customProducts[currentParty]=[];
  customProducts[currentParty].push(prod);
  ls_set(CK,customProducts);
  customKeySet.add(currentParty+'||'+prod);
  rebuildProductIndex();
  inp.value='';
  renderTableBody(document.getElementById('prodSearch').value);
  renderPartyList(document.getElementById('partySearch').value);
  showToast('Product added');
}

function buildPDF(){
  const e=currentEntries();
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text('Order - '+currentParty,15,15);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(80);doc.text('Date: '+todayStr,15,22);
  doc.autoTable({startY:28,head:[['#','Product Name','Qty','Unit']],body:e.map(([p,q,u],i)=>[String(i+1),p,q,u]),
    styles:{font:'helvetica',fontSize:9,cellPadding:3,overflow:'linebreak'},
    headStyles:{fillColor:[124,35,49],textColor:255,fontStyle:'bold'},
    alternateRowStyles:{fillColor:[245,240,228]},
    columnStyles:{0:{cellWidth:8,halign:'center'},1:{cellWidth:'auto'},2:{cellWidth:16,halign:'center'},3:{cellWidth:14,halign:'center'}},
    margin:{left:10,right:10}});
  return doc;
}
function pdfName(){return'Order_'+currentParty.replace(/[^A-Za-z0-9]+/g,'_').slice(0,40)+'_'+new Date().toISOString().slice(0,10)+'.pdf';}

function openModal(action){
  const e=currentEntries();if(e.length===0) return;
  pendingSendAction=action;
  document.getElementById('reviewModal').style.display='flex';
  const titleMap={review:'Review Order',pdf:'Download PDF',whatsapp:'Send to WhatsApp'};
  const btnMap={review:'Done',pdf:'Download PDF',whatsapp:'Send to WhatsApp'};
  document.getElementById('reviewTitle').textContent=titleMap[action]+' \u2014 '+currentParty;
  document.getElementById('reviewSendBtn').textContent=btnMap[action];
  document.getElementById('reviewStatus').textContent='';
  document.getElementById('reviewCancelBtn').textContent='Back';
  const content=document.getElementById('reviewContent');
  content.innerHTML='';
  e.forEach(([prod,qty,unit],i)=>{
    const div=document.createElement('div');div.className='review-item';
    div.innerHTML=`<div class="ri-prod"><div class="name">${eH(prod)}</div></div>
      <div class="ri-qty">
        <input type="number" min="0" step="1" value="${eA(qty)}" data-prod="${eA(prod)}" data-index="${i}" class="review-qty">
        <select data-prod="${eA(prod)}" class="review-unit"><option value="PCS" ${unit==='PCS'?'selected':''}>PCS</option><option value="CB" ${unit==='CB'?'selected':''}>CB</option></select>
        <button class="remove-row" data-index="${i}">&times;</button>
      </div>`;
    content.appendChild(div);
  });
  content.querySelectorAll('.review-qty').forEach(inp=>{
    inp.addEventListener('input',e2=>{const prod=e2.target.getAttribute('data-prod');const v=e2.target.value;if(v===''||Number(v)<=0){delete quantities[currentParty][prod];}else{quantities[currentParty][prod]=v;}saveDraft();});
  });
  content.querySelectorAll('.review-unit').forEach(sel=>{
    sel.addEventListener('change',e2=>{units[currentParty][e2.target.getAttribute('data-prod')]=e2.target.value;saveDraft();});
  });
  content.querySelectorAll('.remove-row').forEach(btn=>{
    btn.addEventListener('click',e2=>{const idx=parseInt(e2.target.getAttribute('data-index'));delete quantities[currentParty][e[idx][0]];saveDraft();openModal(pendingSendAction);});
  });
}
function closeModal(){document.getElementById('reviewModal').style.display='none';pendingSendAction=null;}
function confirmSend(){
  const e=currentEntries();if(e.length===0){showToast('No items');return;}
  if(pendingSendAction==='review'){closeModal();return;}
  const statusEl=document.getElementById('reviewStatus');
  const confirmBtn=document.getElementById('reviewSendBtn');
  const cancelBtn=document.getElementById('reviewCancelBtn');
  if(pendingSendAction==='pdf'){
    buildPDF().save(pdfName());
    e.forEach(([p,q,u])=>{lastOrdered[lKey(currentParty,p)]={qty:q,unit:u};});
    ls_set(SK,lastOrdered);
    renderTableBody(document.getElementById('prodSearch').value);
    statusEl.textContent='✓ PDF downloaded. Edit & download again if needed.';
    confirmBtn.textContent='Download Again';cancelBtn.textContent='Done';
  } else {
    const num=(waNumbers[currentParty]||'').trim();
    if(num.length<6){showToast('Enter WhatsApp number');return;}
    buildPDF().save(pdfName());
    e.forEach(([p,q,u])=>{lastOrdered[lKey(currentParty,p)]={qty:q,unit:u};});
    ls_set(SK,lastOrdered);
    renderTableBody(document.getElementById('prodSearch').value);
    const msg='Order for '+currentParty+' ('+todayStr+') - PDF saved to downloads. Please attach it manually.';
    setTimeout(()=>window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank'),300);
    statusEl.textContent='PDF downloaded. Open WhatsApp and attach the PDF.';
    confirmBtn.textContent='Send Again';cancelBtn.textContent='Done';
  }
}

// Product search
function renderProductResults(query){
  const ul=document.getElementById('productResults');
  const hint=document.getElementById('productHint');
  const q=query.trim().toLowerCase();
  if(q.length<2){ul.innerHTML='';hint.style.display='';return;}
  hint.style.display='none';
  const matches=PRODUCT_KEYS.filter(k=>k.includes(q)).slice(0,150);
  ul.innerHTML='';
  if(matches.length===0){ul.innerHTML='<li style="padding:8px 10px;font-size:12px;color:var(--ink-soft);">No matches</li>';return;}
  matches.forEach(key=>{
    const entry=PRODUCT_INDEX[key];
    const li=document.createElement('li');
    const chips=entry.parties.map(p=>'<span class="pr-party-chip" data-party="'+eA(p)+'" data-prod="'+eA(entry.display)+'">'+eH(p)+'</span>').join('');
    li.innerHTML='<div class="pr-name">'+eH(entry.display)+'</div><div class="pr-parties">'+chips+'</div>';
    ul.appendChild(li);
  });
  ul.querySelectorAll('.pr-party-chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const party=chip.getAttribute('data-party');
      const prod=chip.getAttribute('data-prod');
      switchTab('parties');
      selectParty(party);
      setTimeout(()=>{
        const rows=document.querySelectorAll('.qty-input');
        let target=null;
        rows.forEach(r=>{if(r.getAttribute('data-prod')===prod)target=r;});
        if(target){const tr=target.closest('tr');tr.scrollIntoView({block:'center',behavior:'smooth'});tr.classList.add('row-flash');setTimeout(()=>tr.classList.remove('row-flash'),1700);}
      },80);
    });
  });
}

function switchTab(tab){
  activeTab=tab;
  document.getElementById('tabParties').classList.toggle('active',tab==='parties');
  document.getElementById('tabProducts').classList.toggle('active',tab==='products');
  document.getElementById('partyPane').style.display=tab==='parties'?'flex':'none';
  document.getElementById('productPane').style.display=tab==='products'?'flex':'none';
  const _os=document.getElementById('orderSheet');if(_os)_os.style.display=tab==='parties'?'block':'none';
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(showToast._t);showToast._t=setTimeout(()=>t.classList.remove('show'),1800);
}

// Auto-load Excel from GitHub via CORS proxy
function autoLoadFromGitHub(){
  const proxyUrl='https://corsproxy.io/?url='+encodeURIComponent(GITHUB_EXCEL_URL);
  fetch(proxyUrl,{cache:'no-store'})
    .then(r=>{if(!r.ok) throw new Error('Failed');return r.blob();})
    .then(blob=>{
      const reader=new FileReader();
      reader.onload=function(ev){
        try{
          const data=new Uint8Array(ev.target.result);
          const wb=XLSX.read(data,{type:'array'});
          const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
          if(!rows.length) return;
          const keys=Object.keys(rows[0]);
          const partyKey=keys.find(k=>k.toLowerCase().replace(/\s+/g,' ').trim()==='party name')||keys.find(k=>k.toLowerCase().includes('party'));
          const productKey=keys.find(k=>k.toLowerCase().replace(/\s+/g,' ').trim()==='product name')||keys.find(k=>k.toLowerCase().includes('product'));
          if(!partyKey||!productKey) return;
          let np=0,npr=0;
          rows.forEach(row=>{
            const party=String(row[partyKey]||'').trim();
            const product=String(row[productKey]||'').trim();
            if(!party||!product||party.toLowerCase()==='total') return;
            if(!PARTY_DATA[party]){PARTY_DATA[party]=[];np++;}
            if(!PARTY_DATA[party].some(p=>p.toLowerCase()===product.toLowerCase())){
              PARTY_DATA[party].push(product);
              if(!uploadedData[party]) uploadedData[party]=[];
              uploadedData[party].push(product);
              npr++;
            }
          });
          if(np>0||npr>0){
            Object.keys(PARTY_DATA).forEach(p=>PARTY_DATA[p].sort((a,b)=>a.localeCompare(b)));
            ls_set(UK,uploadedData);
            ls_set(UM,{when:new Date().toISOString()});
            partyNames=Object.keys(PARTY_DATA).sort((a,b)=>a.localeCompare(b));
            rebuildProductIndex();
            renderPartyList(document.getElementById('partySearch').value);
            updateDbStatus();
          }
        }catch(e){console.log('Excel parse error',e);}
      };
      reader.readAsArrayBuffer(blob);
    })
    .catch(e=>console.log('GitHub sync skipped:',e));
}
